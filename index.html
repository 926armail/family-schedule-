    /* ==========================================

    .schedule-switcher {
        display: flex;

        max-width: 420px;

        margin: 0 auto 15px;

        box-sizing: border-box;

        background:
            var(--tg-theme-secondary-bg-color, #ffffff);

            0 2px 6px rgba(0,0,0,0.08);
    }

        flex: 1;

        border: none;

        background: transparent;

        color:
            var(--tg-theme-hint-color, #707579);

        padding: 10px 5px;

        min-height: 42px;

        border-radius: 9px;

        font-family: inherit;

        font-size: 13px;

        font-weight: 600;

        cursor: pointer;

        transition:
            background-color 0.2s ease,
            color 0.2s ease,
            box-shadow 0.2s ease;
    }


    .schedule-option:active {
        transform: scale(0.98);
    }


    /* Активная кнопка */

    .schedule-option.active {
        background-color:
            var(--tg-theme-bg-color, #f4f4f5);

        color:
            var(--tg-theme-text-color, #000000);

        box-shadow:
            0 1px 4px rgba(0,0,0,0.12);
    }


    /* Активная МАМА */

    .schedule-option[data-mode="mom"].active {
        color: #E91E63;
    }


    /* Активный ПАПА */

    .schedule-option[data-mode="dad"].active {
        color: #2196F3;
    }


    /* Активная МАМА + ПАПА */

    .schedule-option[data-mode="both"].active {
        color: #333333;
    }


    /* ==========================================
       КАЛЕНДАРЬ
       ========================================== */

    .calendar {
        width: 100%;

        background:
            var(--tg-theme-secondary-bg-color, #ffffff);

        border-radius: 14px;

        padding: 10px;

        box-sizing: border-box;

        box-shadow:
            0 3px 8px rgba(0,0,0,0.08);
    }


    .calendar-weekdays {

    .calendar-days {

        border-radius: 8px;

        display: flex;

        align-items: center;

        justify-content: center;

        font-size: 15px;

        color: white;

        cursor: pointer;

        transition:
            transform 0.1s ease,
            opacity 0.1s ease,

    }


    .calendar-day:active {

        opacity: 0.8;
    }


    .calendar-empty {
        min-height: 42px;
    }


    /* ==========================================
       ЦВЕТА СТАТУСОВ
       ========================================== */

    .status-mom {

    .status-dad {

    .status-nobody {

    /* Нейтральный день

    .status-neutral {

    /* ==========================================

    .calendar-day.selected {
        outline:
            3px solid
            var(--tg-theme-text-color, #000000);

        outline-offset: -3px;
    }


    /* ==========================================
       СЕГОДНЯ

    .calendar-day.today {
        box-shadow:

    }


    /* ==========================================

    .calendar-legend {

<script>

    // ==========================================
    // TELEGRAM
    // ==========================================

    if (
        window.Telegram &&
        window.Telegram.WebApp
    ) {

        const tg =
            window.Telegram.WebApp;

        tg.ready();

        tg.expand();
    }


    // ==========================================
    // ЭЛЕМЕНТЫ СТРАНИЦЫ
    // ==========================================

    const datePicker =
        document.getElementById("datePicker");

    const resultBox =
        document.getElementById("resultBox");

    const detailsBox =
        document.getElementById("detailsBox");

    const calendarTitle =
        document.getElementById("calendarTitle");

    const calendarDays =
        document.getElementById("calendarDays");

    const calendarLegend =
        document.getElementById("calendarLegend");

    const scheduleOptions =
        document.querySelectorAll(
            ".schedule-option"
        );


    // ==========================================
    // ТЕКУЩИЙ РЕЖИМ КАЛЕНДАРЯ
    // ==========================================

    // По умолчанию показываем график мамы

    let calendarMode = "mom";


    // ==========================================
    // СЕГОДНЯ
    // ==========================================

    const today =
        new Date();

    const yyyy =
        today.getFullYear();

    const mm =
        String(today.getMonth() + 1)
        .padStart(2, "0");

    const dd =
        String(today.getDate())
        .padStart(2, "0");


    datePicker.value =
        `${yyyy}-${mm}-${dd}`;


    // ==========================================
    // РАСЧЁТ ГРАФИКА
    // ==========================================

    function calculateSchedule(dateString) {

        const parts =
            dateString
            .split("-")
            .map(Number);


        const year =
            parts[0];

        const month =
            parts[1];

        const day =
            parts[2];


        const targetDate =
            new Date(
                year,
                month - 1,
                day
            );


        targetDate.setHours(
            0, 0, 0, 0
        );


        const msPerDay =
            24 * 60 * 60 * 1000;


        // ======================================
        // МАМА
        // ======================================

        // 21 сентября 2026 —
        // первый рабочий день

        const womanAnchor =
            new Date(
                2026,
                8,
                21
            );


        womanAnchor.setHours(
            0, 0, 0, 0
        );


        const daysDiffWoman =
            Math.round(
                (
                    targetDate -
                    womanAnchor
                ) / msPerDay
            );


        // ======================================
        // 14-ДНЕВНЫЙ ЦИКЛ МАМЫ
        // ======================================
        //
        // 0  — работа
        // 1  — работа
        // 2  — выходной
        // 3  — выходной
        // 4  — работа
        // 5  — работа
        // 6  — работа
        // 7  — выходной
        // 8  — выходной
        // 9  — работа
        // 10 — работа
        // 11 — выходной
        // 12 — выходной
        // 13 — выходной
        //
        // 2 работа
        // 2 отдых
        // 3 работа
        // 2 отдых
        // 2 работа
        // 3 отдых

        let womanCycleDay =
            daysDiffWoman % 14;


        if (
            womanCycleDay < 0
        ) {

            womanCycleDay += 14;
        }


        const womanWorks =
            [0, 1, 4, 5, 6, 9, 10]
            .includes(
                womanCycleDay
            );


        // ======================================
        // ПАПА
        // ======================================

        const dayOfWeek =
            targetDate.getDay();


        let manWorks =
            false;


        // Вторник и четверг
        // всегда рабочие

        if (
            dayOfWeek === 2 ||
            dayOfWeek === 4
        ) {

            manWorks = true;
        }


        // ======================================
        // ПЯТНИЦА
        // ======================================

        else if (
            dayOfWeek === 5
        ) {

            // 18 сентября 2026 —
            // рабочая пятница

            const manAnchor =
                new Date(
                    2026,
                    8,
                    18
                );


            manAnchor.setHours(
                0, 0, 0, 0
            );


            const daysDiffMan =
                Math.round(
                    (
                        targetDate -
                        manAnchor
                    ) / msPerDay
                );


            const weeksDiff =
                Math.round(
                    daysDiffMan / 7
                );


            // Чётная неделя —
            // работает

            manWorks =
                Math.abs(
                    weeksDiff
                ) % 2 === 0;
        }


        // ======================================
        // ОБЩИЙ СТАТУС
        // ======================================

        let status;


        if (
            !manWorks &&
            !womanWorks
        ) {

            status =
                "all-home";

        }

        else if (
            !manWorks &&
            womanWorks
        ) {

            status =
                "dad";

        }

        else if (
            manWorks &&
            !womanWorks
        ) {

            status =
                "mom";

        }

        else {

            status =
                "nobody";
        }


        return {

            date: targetDate,

            manWorks: manWorks,

            womanWorks: womanWorks,

            status: status
        };
    }


    // ==========================================
    // ОБНОВЛЕНИЕ ОСНОВНОГО РЕЗУЛЬТАТА
    // ==========================================

    function updateSchedule() {

        if (
            !datePicker.value
        ) {

            resultBox.innerHTML =
                "Выберите дату";


            resultBox.style.backgroundColor =
                "#9e9e9e";


            detailsBox.innerHTML =
                "";


            renderCalendar();

            return;
        }


        const schedule =
            calculateSchedule(
                datePicker.value
            );


        // ======================================
        // РЕЗУЛЬТАТ
        // ======================================

        if (
            schedule.status ===
            "all-home"
        ) {

            resultBox.innerHTML =
                "🏠 Все дома";


            resultBox.style.backgroundColor =
                "#4CAF50";

        }

        else if (
            schedule.status ===
            "dad"
        ) {

            resultBox.innerHTML =
                "👨 Только папа";


            resultBox.style.backgroundColor =
                "#2196F3";

        }

        else if (
            schedule.status ===
            "mom"
        ) {

            resultBox.innerHTML =
                "👩 Только мама";


            resultBox.style.backgroundColor =
                "#E91E63";

        }

        else {

            resultBox.innerHTML =
                "🏢 Все на работе";


            resultBox.style.backgroundColor =
                "#607D8B";
        }


        // ======================================
        // ПОДРОБНОСТИ
        // ======================================

        const manStatus =
            schedule.manWorks
                ? "на работе"
                : "дома (выходной)";


        const womanStatus =
            schedule.womanWorks
                ? "на работе"
                : "дома (выходной)";


        detailsBox.innerHTML =
            `👨 Папа: ${manStatus}<br>` +
            `👩 Мама: ${womanStatus}`;


        // ======================================
        // КАЛЕНДАРЬ
        // ======================================

        renderCalendar();
    }


    // ==========================================
    // ОТОБРАЖЕНИЕ ЛЕГЕНДЫ
    // ==========================================

    function renderLegend() {

        if (
            calendarMode === "mom"
        ) {

            calendarLegend.innerHTML = `
                <div class="legend-item">
                    <div
                        class="legend-color status-mom"
                    ></div>
                    Мама работает
                </div>
            `;

        }

        else if (
            calendarMode === "dad"
        ) {

            calendarLegend.innerHTML = `
                <div class="legend-item">
                    <div
                        class="legend-color status-dad"
                    ></div>
                    Папа работает
                </div>
            `;

        }

        else {

            calendarLegend.innerHTML = `
                <div class="legend-item">
                    <div
                        class="legend-color status-mom"
                    ></div>
                    Только мама
                </div>

                <div class="legend-item">
                    <div
                        class="legend-color status-dad"
                    ></div>
                    Только папа
                </div>

                <div class="legend-item">
                    <div
                        class="legend-color status-all-home"
                    ></div>
                    Все дома
                </div>

                <div class="legend-item">
                    <div
                        class="legend-color status-nobody"
                    ></div>
                    Оба работают
                </div>
            `;
        }
    }


    // ==========================================
    // КАЛЕНДАРЬ
    // ==========================================

    function renderCalendar() {

        if (
            !datePicker.value
        ) {

            calendarTitle.innerHTML =
                "";

            calendarDays.innerHTML =
                "";

            return;
        }


        const selectedParts =
            datePicker.value
            .split("-")
            .map(Number);


        const selectedYear =
            selectedParts[0];

        const selectedMonth =
            selectedParts[1] - 1;


        // ======================================
        // НАЗВАНИЕ МЕСЯЦА
        // ======================================

        const monthName =
            new Intl.DateTimeFormat(
                "ru-RU",
                {
                    month: "long",
                    year: "numeric"
                }
            ).format(
                new Date(
                    selectedYear,
                    selectedMonth,
                    1
                )
            );


        calendarTitle.innerHTML =
            monthName
            .charAt(0)
            .toUpperCase() +
            monthName.slice(1);


        // ======================================
        // ОЧИЩАЕМ КАЛЕНДАРЬ
        // ======================================

        calendarDays.innerHTML =
            "";


        // ======================================
        // ПЕРВЫЙ ДЕНЬ МЕСЯЦА
        // ======================================

        const firstDay =
            new Date(
                selectedYear,
                selectedMonth,
                1
            );


        let firstWeekday =
            firstDay.getDay();


        if (
            firstWeekday === 0
        ) {

            firstWeekday = 6;

        } else {

            firstWeekday -= 1;
        }


        // ======================================
        // КОЛИЧЕСТВО ДНЕЙ
        // ======================================

        const daysInMonth =
            new Date(
                selectedYear,
                selectedMonth + 1,
                0
            ).getDate();


        // ======================================
        // ПУСТЫЕ ЯЧЕЙКИ
        // ======================================

        for (
            let i = 0;
            i < firstWeekday;
            i++
        ) {

            const empty =
                document.createElement(
                    "div"
                );


            empty.className =
                "calendar-empty";


            calendarDays.appendChild(
                empty
            );
        }


        // ======================================
        // ДНИ МЕСЯЦА
        // ======================================

        for (
            let day = 1;
            day <= daysInMonth;
            day++
        ) {

            const dateString =
                `${selectedYear}-` +
                `${String(
                    selectedMonth + 1
                ).padStart(2, "0")}-` +
                `${String(day)
                    .padStart(2, "0")}`;


            const schedule =
                calculateSchedule(
                    dateString
                );


            const dayElement =
                document.createElement(
                    "div"
                );


            dayElement.className =
                "calendar-day";


            dayElement.innerHTML =
                day;


            // ==================================
            // ОТОБРАЖЕНИЕ В ЗАВИСИМОСТИ
            // ОТ ВЫБРАННОГО РЕЖИМА
            // ==================================

            if (
                calendarMode === "mom"
            ) {

                // Только график мамы

                if (
                    schedule.womanWorks
                ) {

                    dayElement.classList.add(
                        "status-mom"
                    );

                } else {

                    dayElement.classList.add(
                        "status-neutral"
                    );
                }


            }

            else if (
                calendarMode === "dad"
            ) {

                // Только график папы

                if (
                    schedule.manWorks
                ) {

                    dayElement.classList.add(
                        "status-dad"
                    );

                } else {

                    dayElement.classList.add(
                        "status-neutral"
                    );
                }


            }

            else {

                // Мама + Папа
                // Полная текущая логика

                if (
                    schedule.status ===
                    "mom"
                ) {

                    dayElement.classList.add(
                        "status-mom"
                    );

                }

                else if (
                    schedule.status ===
                    "dad"
                ) {

                    dayElement.classList.add(
                        "status-dad"
                    );

                }

                else if (
                    schedule.status ===
                    "all-home"
                ) {

                    dayElement.classList.add(
                        "status-all-home"
                    );

                }

                else {

                    dayElement.classList.add(
                        "status-nobody"
                    );
                }
            }


            // ==================================
            // ВЫБРАННАЯ ДАТА
            // ==================================

            if (
                dateString ===
                datePicker.value
            ) {

                dayElement.classList.add(
                    "selected"
                );
            }


            // ==================================
            // СЕГОДНЯ
            // ==================================

            if (
                dateString ===
                `${yyyy}-${mm}-${dd}`
            ) {

                dayElement.classList.add(
                    "today"
                );
            }


            // ==================================
            // КЛИК ПО ДАТЕ
            // ==================================

            dayElement.addEventListener(
                "click",
                function() {

                    datePicker.value =
                        dateString;

                    updateSchedule();
                }
            );


            calendarDays.appendChild(
                dayElement
            );
        }


        // Обновляем легенду

        renderLegend();
    }


    // ==========================================
    // ПЕРЕКЛЮЧЕНИЕ МАМА / ПАПА / ОБА
    // ==========================================

    scheduleOptions.forEach(
        function(option) {

            option.addEventListener(
                "click",
                function() {

                    // Определяем выбранный режим

                    calendarMode =
                        this.dataset.mode;


                    // Убираем active
                    // со всех кнопок

                    scheduleOptions.forEach(
                        function(item) {

                            item.classList.remove(
                                "active"
                            );
                        }
                    );


                    // Добавляем active
                    // выбранной кнопке

                    this.classList.add(
                        "active"
                    );


                    // Перерисовываем
                    // календарь

                    renderCalendar();
                }
            );
        }
    );


    // ==========================================
    // ИЗМЕНЕНИЕ ДАТЫ
    // ==========================================

    datePicker.addEventListener(
        "change",
        updateSchedule
    );


    // ==========================================
    // ПЕРВЫЙ РАСЧЁТ
    // ==========================================

    updateSchedule();

</script>
